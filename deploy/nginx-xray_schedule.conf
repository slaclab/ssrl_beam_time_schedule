# SSRL Beam Time calendar at /mail-in-xas/xray_schedule/
#
# Installed by deploy/install.sh as /etc/nginx/mail-in-xas.d/xray_schedule.conf.
# The mail-in XAS portal's server block includes /etc/nginx/mail-in-xas.d/*.conf,
# so this file only contains location blocks. Don't edit the portal's config.
#
# Relies on server-level settings the portal already has (don't repeat them here):
#   absolute_redirect off;   -> the 301 below stays relative (TLS ends at SLAC's proxy)
# The proxy_set_header lines below replace the inherited server-level ones for this location.
#
# `^~` makes this prefix win over the portal's /mail-in-xas/ location even if regex
# locations are added there later.

# Without the trailing slash the page's relative links would resolve to /mail-in-xas/.
location = /mail-in-xas/xray_schedule {
    return 301 /mail-in-xas/xray_schedule/;
}

location ^~ /mail-in-xas/xray_schedule/ {
    # Trailing slash strips the prefix: /mail-in-xas/xray_schedule/api/x -> /api/x
    # Port must match ExecStart in deploy/ssrl-beamtime.service.
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A refresh fetches the SSRL page (normally < 2 s); allow some slack.
    proxy_read_timeout 90s;
}
